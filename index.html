<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Psych Quest: REBT &amp; Reality Therapy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --green:#58CC02; --green-d:#58A700; --green-l:#D7FFB8; --green-b:#A5ED6E; --lime:#89E219;
  --blue:#1CB0F6; --blue-d:#1899D6; --blue-l:#DDF4FF; --blue-b:#84D8FF;
  --red:#FF4B4B; --red-d:#EA2B2B; --red-l:#FFDFE0; --red-b:#FFB2B2;
  --gold:#FFC800; --gold-d:#E5A500; --orange:#FF9600; --orange-d:#CD7900;
  --purple:#CE82FF; --purple-d:#A568CC;
  --ink:#4B4B4B; --muted:#777777; --faint:#AFAFAF; --line:#E5E5E5; --snow:#F7F7F7;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);background:#fff;font-weight:700;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.hidden{display:none!important}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 24px;border-radius:16px;
  font-weight:800;font-size:15px;letter-spacing:.8px;text-transform:uppercase;color:#fff;background:var(--green);
  box-shadow:0 4px 0 var(--green-d);transition:filter .1s,transform .05s,box-shadow .05s;user-select:none}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--green-d)}
.btn.blue{background:var(--blue);box-shadow:0 4px 0 var(--blue-d)}
.btn.red{background:var(--red);box-shadow:0 4px 0 var(--red-d)}
.btn.gold{background:var(--gold);box-shadow:0 4px 0 var(--gold-d)}
.btn.ghost{background:#fff;color:var(--blue);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.ghost.gray{color:var(--muted)}
.btn:disabled{background:var(--line);color:var(--faint);box-shadow:none;cursor:default;filter:none;transform:none}
.btn.wide{width:100%}

/* ---------- Top bar ---------- */
.topbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:2px solid var(--line)}
.topbar-in{max-width:620px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:10px 16px}
.course-chip{display:flex;align-items:center;gap:8px;font-weight:900;color:var(--ink);font-size:15px}
.course-chip .flag{width:34px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--purple),var(--blue));display:grid;place-items:center;color:#fff;font-size:11px;font-weight:900;box-shadow:0 3px 0 var(--purple-d)}
.stats{display:flex;align-items:center;gap:14px}
.stat{display:flex;align-items:center;gap:5px;font-weight:800;font-size:16px}
.stat svg{width:24px;height:24px}
.stat.fire{color:var(--orange)} .stat.gem{color:var(--blue)} .stat.heart{color:var(--red)}
.icon-btn{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;color:var(--faint)}
.icon-btn:hover{background:var(--snow)}
.icon-btn svg{width:22px;height:22px}

/* ---------- Home ---------- */
#home{max-width:620px;margin:0 auto;padding:18px 16px 120px}
.hero{border:2px solid var(--line);border-radius:20px;padding:18px;display:flex;gap:16px;align-items:center;margin-bottom:22px}
.hero .mascot-wrap{width:84px;flex:0 0 84px}
.hero h1{font-size:20px;font-weight:900;line-height:1.2}
.hero p{color:var(--muted);font-size:14px;margin-top:4px;font-weight:700}
.hero .row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:900;letter-spacing:.4px;text-transform:uppercase}
.pill.gold{background:#FFF4CC;color:#B07D00}
.pill.red{background:var(--red-l);color:var(--red-d)}
.pill.green{background:var(--green-l);color:var(--green-d)}
.pill.blue{background:var(--blue-l);color:var(--blue-d)}

.unit{margin-bottom:26px}
.unit-banner{border-radius:16px;padding:16px 18px;color:#fff;display:flex;justify-content:space-between;align-items:center;gap:12px}
.unit-banner .u-label{font-size:13px;font-weight:900;opacity:.85;letter-spacing:.6px;text-transform:uppercase}
.unit-banner .u-title{font-size:20px;font-weight:900;line-height:1.2;margin-top:2px}
.guide-btn{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:10px 14px;border-radius:14px;border:2px solid rgba(0,0,0,.15);
  box-shadow:0 3px 0 rgba(0,0,0,.18);color:#fff;font-weight:900;font-size:13px;letter-spacing:.5px;text-transform:uppercase;background:rgba(255,255,255,.08)}
.guide-btn:active{transform:translateY(3px);box-shadow:none}
.guide-btn svg{width:20px;height:20px}

.path{position:relative;display:flex;flex-direction:column;align-items:center;padding:28px 0 6px;gap:22px}
.node-wrap{position:relative;display:flex;flex-direction:column;align-items:center;z-index:1}
.node-wrap.open{z-index:15}
.node{width:76px;height:70px;border-radius:50%;display:grid;place-items:center;position:relative;transition:transform .05s}
.node svg{width:36px;height:36px}
.node:active{transform:translateY(6px)}
.node.done{background:var(--gold)!important;box-shadow:0 7px 0 var(--gold-d)!important}
.node .ring{position:absolute;inset:-9px;border-radius:50%;border:6px solid var(--line)}
.node.done .ring{border-color:#FFE27A}
.node-label{margin-top:12px;font-size:13px;font-weight:800;color:var(--muted);text-align:center;max-width:150px;line-height:1.2}
.start-bubble{position:absolute;top:-46px;background:#fff;border:2px solid var(--line);border-radius:12px;padding:6px 12px;font-weight:900;font-size:14px;letter-spacing:.6px;
  text-transform:uppercase;animation:bob 1.2s ease-in-out infinite;white-space:nowrap;z-index:2}
.start-bubble::after{content:"";position:absolute;bottom:-8px;left:50%;transform:translateX(-50%) rotate(45deg);width:12px;height:12px;background:#fff;border-right:2px solid var(--line);border-bottom:2px solid var(--line)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.popover{position:absolute;top:calc(100% + 10px);z-index:15;width:270px;border-radius:16px;padding:16px;color:#fff;animation:pop .15s ease-out}
.popover::before{content:"";position:absolute;top:-8px;left:50%;transform:translateX(-50%) rotate(45deg);width:16px;height:16px;background:inherit}
.popover h3{font-size:17px;font-weight:900;margin-bottom:4px}
.popover p{font-size:14px;font-weight:700;opacity:.9;margin-bottom:12px}
.popover .btn{width:100%;background:#fff;color:inherit;box-shadow:0 4px 0 rgba(0,0,0,.18)}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}

.boss{margin-top:8px;border:2px solid var(--line);border-radius:20px;padding:18px;display:flex;align-items:center;gap:16px}
.boss .trophy{width:64px;height:64px;flex:0 0 64px;border-radius:18px;background:var(--gold);box-shadow:0 5px 0 var(--gold-d);display:grid;place-items:center}
.boss .trophy svg{width:36px;height:36px}
.boss h3{font-size:18px;font-weight:900}
.boss p{font-size:14px;color:var(--muted);margin:2px 0 10px}

.fab-mistakes{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:25;max-width:588px;width:calc(100% - 32px)}

/* ---------- Lesson ---------- */
#lesson{position:fixed;inset:0;background:#fff;z-index:40;display:flex;flex-direction:column}
.l-head{max-width:1000px;width:100%;margin:0 auto;display:flex;align-items:center;gap:16px;padding:20px 16px 10px}
.l-head .x{color:var(--faint);width:32px;height:32px;display:grid;place-items:center;border-radius:8px}
.l-head .x:hover{background:var(--snow)}
.l-head .x svg{width:22px;height:22px}
.bar{flex:1;height:16px;background:var(--line);border-radius:99px;overflow:hidden;position:relative}
.bar-fill{height:100%;background:var(--green);border-radius:99px;transition:width .4s cubic-bezier(.3,1.4,.6,1);position:relative;min-width:16px}
.bar-fill::after{content:"";position:absolute;left:8px;right:8px;top:4px;height:4px;border-radius:99px;background:rgba(255,255,255,.3)}
.l-hearts{display:flex;align-items:center;gap:5px;color:var(--red);font-weight:900;font-size:17px}
.l-hearts svg{width:26px;height:26px}
.l-hearts.inf{color:var(--blue)}
.l-body{flex:1;overflow-y:auto;padding:12px 16px 24px}
.l-inner{max-width:600px;margin:0 auto}
.combo{height:24px;color:var(--orange);font-weight:900;font-size:14px;letter-spacing:.8px;text-transform:uppercase;display:flex;align-items:center;gap:6px;margin-bottom:6px}
.combo svg{width:20px;height:20px}
.combo.pop{animation:pop .25s ease-out}
.q-tag{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.q-type{font-size:13px;font-weight:900;color:var(--purple-d);letter-spacing:.6px;text-transform:uppercase}
.q-title{font-size:24px;font-weight:900;line-height:1.25;margin-bottom:18px}
.speaker{display:flex;align-items:flex-end;gap:12px;margin-bottom:22px}
.speaker .mascot-wrap{width:92px;flex:0 0 92px}
.bubble{position:relative;border:2px solid var(--line);border-radius:16px;padding:14px 16px;font-size:17px;line-height:1.45;font-weight:700;color:var(--ink);margin-bottom:22px}
.bubble::before{content:"";position:absolute;left:-9px;bottom:18px;width:14px;height:14px;background:#fff;border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}

.choices{display:flex;flex-direction:column;gap:10px}
.choice{display:flex;align-items:center;gap:14px;text-align:left;border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:13px 16px;font-size:16px;font-weight:700;line-height:1.35;background:#fff;transition:background .1s}
.choice:hover:not(:disabled){background:var(--snow)}
.choice:active:not(:disabled){transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
.choice .key{flex:0 0 30px;height:30px;border:2px solid var(--line);border-radius:8px;display:grid;place-items:center;font-size:14px;font-weight:800;color:var(--faint)}
.choice.multi .key{border-radius:8px}
.choice.sel{background:var(--blue-l);border-color:var(--blue-b);color:var(--blue-d)}
.choice.sel .key{border-color:var(--blue-b);color:var(--blue-d)}
.choice.right{background:var(--green-l);border-color:var(--green-b);color:var(--green-d)}
.choice.right .key{border-color:var(--green-b);color:var(--green-d)}
.choice.wrong{background:var(--red-l);border-color:var(--red-b);color:var(--red-d)}
.choice.wrong .key{border-color:var(--red-b);color:var(--red-d)}
.choice.shake{animation:shake .35s}
.choice:disabled{cursor:default}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

.sum{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:.9;margin:0 2px;font-size:1.25em}
.sum .lim{font-size:.5em;font-weight:800}
.fx{font-family:'Cambria Math','Times New Roman',serif;font-style:italic;font-weight:600;font-size:18px}
.fx sub,.fx sup{font-size:.65em}

/* match */
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:flex;flex-direction:column;gap:10px}
.tile{min-height:64px;border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:10px 12px;font-size:15px;font-weight:800;text-align:center;background:#fff;line-height:1.25;display:flex;align-items:center;justify-content:center}
.tile:hover:not(:disabled){background:var(--snow)}
.tile.sel{background:var(--blue-l);border-color:var(--blue-b);color:var(--blue-d)}
.tile.ok{background:var(--green-l);border-color:var(--green-b);color:var(--green-d)}
.tile.bad{background:var(--red-l);border-color:var(--red-b);color:var(--red-d);animation:shake .35s}
.tile.gone{background:#fff;border-color:var(--line);color:#D6D6D6;cursor:default}
.tile.term{font-weight:900;font-size:16px}

/* learn card */
.learn{border:2px solid var(--line);border-bottom-width:4px;border-radius:18px;padding:18px;margin-bottom:8px}
.learn h2{font-size:22px;font-weight:900;margin-bottom:8px;line-height:1.25}
.learn .body{font-size:16px;line-height:1.55;font-weight:700}
.learn .body b{color:var(--blue-d)}
.learn .body ul,.learn .body ol{margin:8px 0 0 22px}
.learn .ex{margin-top:12px;background:var(--blue-l);border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.45;color:var(--blue-d)}
.learn .ex::before{content:"Example";display:block;font-size:12px;font-weight:900;letter-spacing:.6px;text-transform:uppercase;margin-bottom:4px}

/* footer */
.l-foot{border-top:2px solid var(--line);background:#fff;transition:background .15s}
.l-foot.ok{background:var(--green-l);border-color:transparent}
.l-foot.no{background:var(--red-l);border-color:transparent}
.foot-in{max-width:1000px;margin:0 auto;padding:18px 16px 22px;display:flex;align-items:center;gap:16px;justify-content:space-between}
.fb{display:flex;gap:14px;align-items:flex-start;flex:1;min-width:0;max-height:42vh;overflow-y:auto}
.fb-icon{flex:0 0 64px;height:64px;border-radius:50%;background:#fff;display:grid;place-items:center}
.fb-icon svg{width:34px;height:34px}
.fb h3{font-size:22px;font-weight:900}
.l-foot.ok .fb h3{color:var(--green-d)} .l-foot.no .fb h3{color:var(--red-d)}
.fb .ans{font-size:15px;font-weight:800;margin-top:4px}
.l-foot.ok .fb .ans{color:var(--green-d)} .l-foot.no .fb .ans{color:var(--red-d)}
.fb .why{font-size:15px;font-weight:700;line-height:1.45;margin-top:6px}
.l-foot.ok .fb .why{color:#3E7D00} .l-foot.no .fb .why{color:#B3261E}
.foot-in .btn{min-width:160px}
.l-foot.no .btn{background:var(--red);box-shadow:0 4px 0 var(--red-d)}
@media (max-width:640px){
  .foot-in{flex-direction:column;align-items:stretch}
  .foot-in .btn{width:100%}
  .fb-icon{display:none}
  .q-title{font-size:21px}
  .bubble{font-size:16px}
  .speaker .mascot-wrap{width:70px;flex-basis:70px}
}

/* ---------- Overlays ---------- */
.screen{position:fixed;inset:0;background:#fff;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;overflow:hidden}
.screen .mascot-wrap{width:150px;margin-bottom:12px}
.screen h2{font-size:30px;font-weight:900;color:var(--gold-d);margin-bottom:6px}
.screen h2.red{color:var(--red)}
.screen .sub{color:var(--muted);font-size:17px;margin-bottom:24px;max-width:420px}
.cards{display:flex;gap:12px;margin-bottom:30px;flex-wrap:wrap;justify-content:center}
.scard{width:130px;border-radius:16px;border:2px solid;overflow:hidden}
.scard .t{font-size:12px;font-weight:900;color:#fff;padding:5px 0;letter-spacing:.6px;text-transform:uppercase}
.scard .v{background:#fff;margin:0 2px 2px;border-radius:0 0 13px 13px;padding:12px 0;font-size:22px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:6px}
.scard .v svg{width:22px;height:22px}
.scard.gold{border-color:var(--gold);background:var(--gold)} .scard.gold .v{color:var(--gold-d)}
.scard.green{border-color:var(--green);background:var(--green)} .scard.green .v{color:var(--green-d)}
.scard.blue{border-color:var(--blue);background:var(--blue)} .scard.blue .v{color:var(--blue-d)}
.scard.orange{border-color:var(--orange);background:var(--orange)} .scard.orange .v{color:var(--orange)}
.screen .actions{display:flex;flex-direction:column;gap:12px;width:100%;max-width:340px}
.review-list{max-width:520px;width:100%;text-align:left;margin:-10px 0 24px;max-height:30vh;overflow-y:auto;border:2px solid var(--line);border-radius:16px;padding:12px 14px}
.review-list .ri{padding:8px 0;border-bottom:2px solid var(--snow);font-size:14px;line-height:1.35}
.review-list .ri:last-child{border:none}
.review-list .ri b{color:var(--red-d)}
.review-list .ri span{color:var(--green-d)}

.confetti{position:absolute;top:-20px;width:10px;height:16px;border-radius:3px;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:80;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
@media (min-width:700px){.modal-bg{align-items:center}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:#fff;width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:22px 20px 26px;max-height:86vh;overflow-y:auto;animation:up .2s ease-out}
@media (min-width:700px){.modal{border-radius:22px}}
@keyframes up{from{transform:translateY(40px)}to{transform:translateY(0)}}
.modal h2{font-size:22px;font-weight:900;margin-bottom:4px}
.modal .msub{color:var(--muted);font-size:14px;margin-bottom:16px}
.gb-item{display:flex;gap:12px;padding:12px 0;border-bottom:2px solid var(--snow);align-items:flex-start}
.gb-item:last-of-type{border:none}
.gb-term{flex:0 0 120px;font-weight:900;font-size:15px}
.gb-def{font-size:15px;color:var(--ink);font-weight:700;line-height:1.4}
.tip{margin-top:12px;background:#FFF4CC;border-radius:14px;padding:12px 14px;font-size:14px;color:#8A6300;line-height:1.45}
.tip b{color:#6B4C00}
.modal .btn{margin-top:18px}

/* mascot moods */
.mascot img{display:block;width:100%;height:auto}
.mascot .m-happy,.mascot .m-sad{display:none}
.mascot.happy .m-norm,.mascot.sad .m-norm{display:none}
.mascot.happy .m-happy{display:block}
.mascot.sad .m-sad{display:block}
@media (prefers-reduced-motion:no-preference){
  .mascot.happy{animation:hop .3s ease-out}
  .mascot.sad{animation:shake .3s}
}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-12px)}}
</style>
</head>
<body>

<!-- ============ HOME ============ -->
<header class="topbar" id="topbar">
  <div class="topbar-in">
    <div class="course-chip"><div class="flag" id="cTag"></div><span id="cMod"></span></div>
    <div class="stats">
      <div class="stat fire" title="Day streak"><svg viewBox="0 0 24 24"><path fill="#FF9600" d="M12 2c1 3.5 5.5 5.6 5.5 11a5.5 5.5 0 0 1-11 0c0-2.4 1-4 2.2-5.2.2 1.6.9 2.7 2 3.2C10 8.4 10.6 4.6 12 2z"/><path fill="#FFC800" d="M12 12.5c.6 1.6 2.5 2.4 2.5 4.6a2.5 2.5 0 0 1-5 0c0-1.5.9-2.4 1.5-3 .2.7.5 1.1 1 1.2 0-1-.2-1.9 0-2.8z"/></svg><span id="sStreak">0</span></div>
      <div class="stat gem" title="Total XP"><svg viewBox="0 0 24 24"><path fill="#1CB0F6" d="M6 3h12l4 6-10 12L2 9z"/><path fill="#84D8FF" d="M6 3h12l-3 6H9z"/><path fill="#1899D6" d="M2 9h7l3 12z"/></svg><span id="sXP">0</span></div>
      <div class="stat heart" title="Hearts per lesson"><svg viewBox="0 0 24 24"><path fill="#FF4B4B" d="M12 21s-8.5-5.3-8.5-11.2A4.8 4.8 0 0 1 12 6.6a4.8 4.8 0 0 1 8.5 3.2C20.5 15.7 12 21 12 21z"/><ellipse cx="8" cy="9" rx="1.8" ry="1.2" fill="#fff" opacity=".6"/></svg><span>5</span></div>
      <button class="icon-btn" id="soundBtn" title="Sound on/off"></button>
    </div>
  </div>
</header>

<main id="home">
  <section class="hero">
    <div class="mascot-wrap" data-mascot="idle"></div>
    <div>
      <h1 id="hTitle"></h1>
      <p id="hBlurb"></p>
      <div class="row">
        <span class="pill gold" id="hScore"></span>
        <span class="pill blue" id="lessonsDone">0/9 lessons</span>
      </div>
    </div>
  </section>
  <div id="units"></div>
  <section class="boss">
    <div class="trophy"><svg viewBox="0 0 24 24"><path fill="#fff" d="M7 3h10v2h3v3a4 4 0 0 1-4 4h-.3A5 5 0 0 1 13 14.9V17h3v4H8v-4h3v-2.1A5 5 0 0 1 8.3 12H8a4 4 0 0 1-4-4V5h3zm-1 4v1a2 2 0 0 0 1 1.7V7zm11 0v2.7a2 2 0 0 0 1-1.7V7z"/></svg></div>
    <div style="flex:1">
      <h3 id="bossTitle"></h3>
      <p id="bossSub"></p>
      <button class="btn gold" id="bossBtn">Fight</button>
    </div>

l2:{type:'learn',title:"Why Ellis left psychoanalysis",

q3:{type:'single',src:3,prompt:"According to Ellis, where does the key to treating emotional struggles lie?",

l3:{type:'learn',title:"Ellis's rough childhood",say:"Origin story time.",
 body:"Albert Ellis was born <b>September 27, 1913</b>, in <b>Pittsburgh, Pennsylvania</b>, the <b>eldest of three</b> children. His family was emotionally distant and his mother was <b>overcritical</b> and self-absorbed. A sickly child, he was <b>hospitalized again and again between ages 5 and 7</b> (kidney disease, severe infections) and his parents seldom visited. This built his <b>independence and emotional resilience</b>. He also took care of his siblings."},
l4:{type:'learn',title:"Ellis faces his fears",

q6:{type:'single',src:6,prompt:"Where and when was Albert Ellis born?",

q7:{type:'single',src:7,prompt:"What did Ellis's lonely childhood hospital stays build in him?",

q8:{type:'single',src:8,prompt:"How did Ellis tackle his shyness around women?",

q9:{type:'single',src:9,prompt:"Ellis's 1930s unpublished autobiography was about his shame and anxiety over:",

l5:{type:'learn',title:"Stoic roots and the CBT link",
 body:"Ellis drew on <b>Stoic philosophy</b>: emotional suffering comes not from events but from <b>how we interpret and evaluate them</b>. So <b>irrational beliefs</b> (rigid, unrealistic, absolutist thoughts) are the root of distress. Ellis is called the <b>grandfather of CBT</b> because REBT was one of its pillars, and he was one of the <b>first to assign homework</b> between sessions, like in vivo behavioral exposure. The lesson's distinction: <b>CBT</b> mainly aims to modify <b>maladaptive behaviors</b>, while <b>REBT</b> targets the <b>irrational beliefs</b> under emotional distress."},
l6:{type:'learn',title:"From LAMP to REBT",
 body:"In the <b>1940s</b> Ellis founded the <b>LAMP Institute (Love and Marriage Problems)</b>. At <b>age 40</b> he earned a doctorate in <b>clinical psychology from Columbia University</b>. He then ran two practices at once, <b>traditional psychoanalysis</b> and <b>marital and sex therapy</b>, and found the active, attitude-changing second one more effective. He believed therapists should use <b>any strategy that helps clients change</b>, and the name grew with that: <b>Rational Therapy</b> → <b>Rational-Emotive Therapy</b> → <b>Rational Emotive Behavior Therapy</b>, a term proposed by <b>Ray Corsini in 1994</b>.",
 ex:"Name hook: R → RE → REB. Each rename adds a piece: thinking, then emotion, then behavior."},
q11:{type:'single',src:11,prompt:"Which philosophy inspired REBT?",

q13:{type:'single',src:13,prompt:"According to the lesson, what is the key difference between CBT and REBT?",

/* ---------------- UNIT 2: Human nature & beliefs ---------------- */
l7:{type:'learn',title:"REBT's view of people",say:"Four big ideas. Got a mnemonic for you.",
 body:"<b>Personal responsibility:</b> we are responsible for our own feelings and actions. <b>Rational vs. irrational thinking:</b> everyone can think both ways. Rational thoughts are logical and realistic, irrational ones are extreme and illogical, and we shift between them. <b>Growth and change:</b> let go of irrational beliefs and adopt rational ones. <b>Holistic interconnectedness:</b> thoughts, emotions, and behaviors are one connected system, so changing how we think changes how we feel and act.",
 ex:"Made-up mnemonic: <b>R-R-G-H</b>, “Really Rational Growth Helps” = Responsibility, Rational vs. irrational, Growth, Holistic."},
q18:{type:'single',src:18,prompt:"In REBT, who is responsible for a person's feelings and actions?",
 choices:["The person themself","Their parents","Their environment","Their therapist"],ans:[0],
 why:"Personal responsibility: individuals choose whether their behaviors help or harm them, and can control their thoughts and beliefs."},
q19:{type:'single',src:19,prompt:"Which statement about rational and irrational thinking is true in REBT?",
 choices:["Everyone can think both ways and often shifts between them","Only people with disorders think irrationally","Rational thinkers never have irrational thoughts","Irrational thinking cannot be changed"],ans:[0],
 why:"Ellis said everyone can think rationally and irrationally, and people often shift between the two."},
q20:{type:'single',src:20,prompt:"Rational thoughts are ___, while irrational thoughts are ___.",
 choices:["logical and realistic / extreme and illogical","emotional / unemotional","positive / negative","conscious / unconscious"],ans:[0],
 why:"Rational = logical and realistic. Irrational = extreme and illogical. It's not about positive vs. negative."},
q21:{type:'single',src:21,prompt:"“Changing how you think can change how you feel and act.” Which view of human nature is this?",
 choices:["Holistic interconnectedness","Personal responsibility","Growth and change","Rational vs. irrational thinking"],ans:[0],
 why:"Holistic interconnectedness treats thoughts, emotions, and behaviors as parts of one system."},
q22:{type:'single',src:22,prompt:"Which is NOT one of REBT's views of human nature?",
 choices:["Behavior is driven by unconscious childhood conflicts","Personal responsibility","Growth and change","Holistic interconnectedness"],ans:[0],
 why:"Unconscious conflicts are a psychoanalytic idea, the very thing Ellis moved away from."},

l8:{type:'learn',title:"Where disturbance comes from",
 body:"We <b>learn irrational beliefs from significant others during childhood</b>, then <b>re-create them</b> throughout life. We keep reinforcing them through <b>autosuggestion and self-repetition</b>, and act in ways that fit them. The key twist: it is largely <b>our own repetition</b> of those early beliefs, <b>not the parent's</b>, that keeps them alive.",
 ex:"Your parent said “You must be the best” a few times. You've repeated it to yourself a thousand times since. REBT says your thousand repeats are what keep it going."},
l9:{type:'learn',title:"The three musts",
 body:"Ellis said <b>self-damning and self-blame</b> are at the core of many disturbances, so we need to <b>fully, unconditionally accept ourselves</b>, flaws and all. We tend to turn preferences into dogmatic <b>“shoulds,” “musts,” and “oughts.”</b> The <b>three basic musts</b> (Ellis & Ellis, 2019a):<br>1. <b>“I must do well and be loved and approved by others.”</b><br>2. <b>“Other people must treat me fairly, kindly, and well.”</b><br>3. <b>“The world and my living conditions must be comfortable, gratifying, and just.”</b>",
 ex:"Made-up hook: the three musts aim at <b>Me, You, and the World</b>."},
q23:{type:'single',src:23,prompt:"According to REBT, where do we first learn irrational beliefs?",
 choices:["From significant others during childhood","From our genes","From traumatic events in adulthood","From the media"],ans:[0],
 why:"Irrational beliefs are learned from significant others in childhood, then re-created throughout life."},
q24:{type:'single',src:24,prompt:"What mainly keeps early irrational beliefs alive?",
 choices:["Our own repetition through autosuggestion and self-repetition","Our parents repeating them to us","The unconscious mind","Not going to therapy"],ans:[0],
 why:"Classic trap: it's our own repetition, not the parent's, that keeps dysfunctional attitudes operating."},
q25:{type:'single',src:25,prompt:"Ellis said what is at the core of many emotional disturbances?",
 choices:["Self-damning and self-blame","Low intelligence","Unresolved Oedipal conflicts","Poor diet and sleep"],ans:[0],
 why:"Self-damning and self-blame. The cure is unconditional self-acceptance."},
q26:{type:'single',src:26,prompt:"Irrational beliefs usually show up as:",
 choices:["Dogmatic shoulds, musts, and oughts","Gentle preferences and wishes","Factual observations","Questions about the future"],ans:[0],
 why:"We turn preferences (“I'd like to”) into demands (“I must”). Those demands create disruptive feelings."},
q27:{type:'single',src:27,prompt:"“Other people must treat me fairly, kindly, and well” is which basic must?",
 choices:["The must about others","The must about myself","The must about the world","Not one of the three musts"],ans:[0],
 why:"Must #2 is about others. #1 is about me (do well, be approved), #3 is about the world (comfortable, gratifying, just)."},
q28:{type:'multi',need:2,src:28,prompt:"Which TWO are among Ellis's three basic musts? (Choose 2)",
 choices:["“I must do well and be loved and approved by others.”","“The world and my living conditions must be comfortable, gratifying, and just.”","“I must always understand my unconscious motives.”","“I must never feel any emotion.”"],ans:[0,1],
 why:"The three musts are about me, others, and the world. The other two choices are made up."},

l10:{type:'learn',title:"What REBT aims for",
 body:"REBT works mostly in the <b>present</b>, showing how perceptions of situations cause distress and unhealthy behavior. It especially helps with <b>depression, anxiety, addictive behaviors, phobias, procrastination, eating disorders, sleep problems</b>, and overwhelming <b>anger, guilt, shame, or rage</b>. Another goal is the three acceptances: <b>unconditional self-acceptance (USA)</b>, <b>unconditional other-acceptance (UOA)</b>, and <b>unconditional life-acceptance (ULA)</b>. Accepting yourself makes it easier to accept others and life as it is."},
l11:{type:'learn',title:"The therapist's five hats",
 body:"<b>Teacher/Educator:</b> teaches the ABC model and how to tell rational from irrational beliefs.<br><b>Safe Space Facilitator:</b> offers empathy and validation <b>without reinforcing irrational beliefs</b>.<br><b>Disputer:</b> challenges irrational beliefs with <b>logical, empirical, and pragmatic</b> disputation.<br><b>Coping Strategies Facilitator:</b> teaches practical coping and emotional regulation techniques.<br><b>Empowerment Advocate:</b> builds <b>self-efficacy</b> by helping clients see their strengths."},
q29:{type:'single',src:29,prompt:"What do USA, UOA, and ULA stand for?",
 choices:["Unconditional self-, other-, and life-acceptance","Universal self-, other-, and life-awareness","Unconditional self-, other-, and love-attachment","Unified self-, outer-, and life-analysis"],ans:[0],
 why:"Unconditional self-acceptance, other-acceptance, and life-acceptance (Ellis & Ellis, 2019a)."},
q30:{type:'single',src:30,prompt:"Which is NOT listed as an issue REBT can help with?",
 choices:["Color blindness","Procrastination","Phobias","Sleep problems"],ans:[0],
 why:"The list: depression, anxiety, addictive behaviors, phobias, procrastination, eating disorders, sleep problems, and overwhelming anger, guilt, shame, or rage."},
q31:{type:'single',src:31,prompt:"A therapist explains the ABC model to a client. Which role is this?",
 choices:["Teacher/Educator","Disputer","Safe Space Facilitator","Empowerment Advocate"],ans:[0],
 why:"Teaching the ABC model and how to spot irrational beliefs is the Teacher/Educator role."},
q32:{type:'single',src:32,prompt:"A therapist questions a client's “must” using logic, evidence, and practicality. Which role?",
 choices:["Disputer","Teacher/Educator","Coping Strategies Facilitator","Safe Space Facilitator"],ans:[0],
 why:"The Disputer uses logical, empirical, and pragmatic disputation on musts and shoulds."},
q33:{type:'single',src:33,prompt:"The Safe Space Facilitator validates the client's experiences but must avoid:",
 choices:["Reinforcing irrational beliefs","Showing empathy","Building rapport","Letting clients express emotions"],ans:[0],
 why:"Validate the feelings, never the irrational belief. Empathy and rapport are exactly what this role provides."},
q34:{type:'single',src:34,prompt:"Which role focuses on building self-efficacy by helping clients see their strengths?",
 choices:["Empowerment Advocate","Disputer","Teacher/Educator","Coping Strategies Facilitator"],ans:[0],
 why:"Empowerment Advocate: recognize strengths, build self-efficacy, take charge of your life."},
m2:{type:'match',prompt:"Match each therapist role to its job",pairs:[["Teacher/Educator","Explains the ABC model"],["Disputer","Challenges irrational beliefs"],["Safe Space Facilitator","Empathy without reinforcing beliefs"],["Coping Facilitator","Teaches emotion regulation"],["Empowerment Advocate","Builds self-efficacy"]],
 why:"Five hats: teach, provide safety, dispute, teach coping, empower."},

/* ---------------- UNIT 3: ABCDE ---------------- */
l12:{type:'learn',title:"A, B, C",say:"This one's the heart of REBT. Slow down here.",
 body:"<b>A = Activating event:</b> an event, adversity, or a person's inference about it.<br><b>B = Belief:</b> what the person believes about A.<br><b>C = Consequence:</b> the emotional and behavioral reaction, healthy or unhealthy.<br>The big rule: <b>A does not cause C. B largely creates C.</b> People are largely responsible for creating their own emotional reactions.",
 ex:"A: your crush leaves you on read. B: “They must hate me, I'm unlovable.” C: you feel crushed and avoid them. Change B to “Maybe they're busy” and C changes too."},
q35:{type:'single',src:35,prompt:"In the ABC model, what does A stand for?",
 choices:["Activating event","Attitude","Anxiety","Acceptance"],ans:[0],
 why:"A = Activating event: an event, adversity, or an inference about one."},
q36:{type:'single',src:36,prompt:"According to REBT, what largely creates C, the emotional consequence?",
 choices:["B, the person's belief about the event","A, the activating event itself","D, the disputing","The therapist's response"],ans:[0],
 why:"The core rule: A does not cause C. B, the belief about A, largely creates C."},
q37:{type:'single',src:37,prompt:"Jo fails a test, thinks “I'm a total failure,” then skips class for a week. What is “skips class for a week”?",
 choices:["C: Consequence","A: Activating event","B: Belief","D: Disputation"],ans:[0],
 why:"Skipping class is the behavioral reaction, so it's C. Failing the test is A, and “I'm a total failure” is B."},
q38:{type:'single',src:38,prompt:"In the same example, “I'm a total failure” is:",
 choices:["B: Belief","A: Activating event","C: Consequence","E: Effect"],ans:[0],
 why:"It's Jo's belief about the event, and an irrational, self-damning one."},

l13:{type:'learn',title:"D and E",
 body:"<b>D = Disputing:</b> challenging irrational beliefs. It has three parts: <b>detecting</b>, <b>debating</b>, and <b>discriminating</b> (telling irrational, self-defeating beliefs from rational, self-helping ones). Beliefs are questioned <b>logically, empirically, and pragmatically</b>.<br><b>E = Effect:</b> a <b>new effective philosophy</b>, rational beliefs that replace the irrational ones and prevent the unhealthy consequences. <b>Collaboratively designed homework</b> helps keep the gains.",
 ex:"Logical: “Does failing one test make me a total failure?” Empirical: “What's the evidence?” Pragmatic: “Is believing this helping me?”"},
q39:{type:'single',src:39,prompt:"What are the three components of disputing?",
 choices:["Detecting, debating, discriminating","Defining, debating, deciding","Detecting, describing, deleting","Doubting, denying, discriminating"],ans:[0],
 why:"Three Ds inside D: detect the belief, debate it, discriminate rational from irrational."},
q40:{type:'single',src:40,prompt:"Learning to tell self-defeating beliefs from self-helping beliefs is called:",
 choices:["Discriminating","Detecting","Debating","Reframing"],ans:[0],
 why:"Discriminating = telling irrational (self-defeating) from rational (self-helping). Detecting just finds them."},
q41:{type:'multi',need:3,src:41,prompt:"Which are the three ways to question irrational beliefs? (Choose 3)",
 choices:["Logically","Empirically","Pragmatically","Hypnotically"],ans:[0,1,2],
 why:"Logical (does it make sense?), empirical (where's the evidence?), pragmatic (does it help me?)."},
q42:{type:'single',src:42,prompt:"What is E in the ABCDE model?",
 choices:["Effect: a new effective philosophy of rational beliefs","Emotion: the feeling caused by the event","Evaluation: judging whether behavior works","Exposure: facing the feared event"],ans:[0],
 why:"E = Effect, the new effective philosophy. Don't mix it with the E in WDEP (Evaluation), which is Reality Therapy."},
q43:{type:'single',src:43,prompt:"Which shows the model in the correct order?",
 choices:["Activating event → Belief → Consequence → Disputation → Effect","Belief → Activating event → Consequence → Effect → Disputation","Activating event → Consequence → Belief → Disputation → Effect","Disputation → Activating event → Belief → Consequence → Effect"],ans:[0],
 why:"It's just the alphabet: A, B, C, D, E."},
m3:{type:'match',prompt:"Match each letter to its meaning",pairs:[["A","Activating event"],["B","Belief about the event"],["C","Emotional and behavioral reaction"],["D","Disputing irrational beliefs"],["E","New effective philosophy"]],
 why:"A happens, B is what you tell yourself, C is the result, D challenges B, E is the healthier new belief."},

/* ---------------- UNIT 4: REBT techniques ---------------- */
l14:{type:'learn',title:"Thinking tools, part 1",say:"Toolbox time. Sort them by thinking, feeling, doing.",
 body:"<b>Rational analysis:</b> clients analyze <b>past situations</b> to uncover and challenge irrational beliefs.<br><b>Cognitive homework:</b> clients <b>list their problems, identify their absolutist beliefs, and challenge them</b>, tracking down the “shoulds” and “musts” in their self-talk.<br><b>Bibliotherapy:</b> reading as an <b>adjunctive</b> form of treatment. Pluses: <b>cost-effective, widely available, and able to reach a broad range of people</b>."},
l15:{type:'learn',title:"Thinking tools, part 2",
 body:"<b>Devil's advocate (reverse role playing):</b> the <b>therapist argues in favor of the client's irrational belief</b> so the client sees the flaws in it.<br><b>Reframing:</b> reinterpreting a negative event as <b>less catastrophic</b>, or finding positive aspects in it, to reduce distress.",
 ex:"Therapist: “Right, one bad grade means you'll never succeed at anything!” Client: “Wait, that's not true.” That's devil's advocate working."},
q44:{type:'single',src:44,prompt:"In devil's advocate (reverse role playing), what does the therapist do?",
 choices:["Argues in favor of the client's irrational belief","Argues against everything the client says","Plays the client's parent","Stays silent so the client argues alone"],ans:[0],
 why:"The therapist defends the irrational belief so the client is the one who finds its flaws."},
q45:{type:'single',src:45,prompt:"Clients list their problems, identify absolutist beliefs, and challenge them between sessions. This is:",
 choices:["Cognitive homework","Bibliotherapy","Shame-attacking","Rational emotive imagery"],ans:[0],
 why:"Cognitive homework hunts down the shoulds and musts in the client's self-talk."},
q46:{type:'single',src:46,prompt:"Which is an advantage of bibliotherapy listed in the lesson?",
 choices:["Cost-effectiveness","It replaces the therapist entirely","It works only for children","It needs no reading"],ans:[0],
 why:"Advantages: cost-effectiveness, widespread availability, and reaching a broad range of people."},
q47:{type:'single',src:47,prompt:"In REBT, bibliotherapy is used as what kind of treatment?",
 choices:["Adjunctive (supporting) treatment","The main and only treatment","A diagnostic test","A behavioral exposure"],ans:[0],
 why:"It's adjunctive: it supports therapy, it doesn't replace it."},
q48:{type:'single',src:48,prompt:"A client calls a breakup “the end of my life,” and the therapist helps them see it as painful but also a chance to grow. This is:",
 choices:["Reframing","Devil's advocate","Rational analysis","Role playing"],ans:[0],
 why:"Reframing makes the event less catastrophic or finds a positive side in it."},
q49:{type:'single',src:49,prompt:"Rational analysis has clients examine ___ to uncover irrational beliefs.",
 choices:["Past situations","Their dreams","Their family tree","Predictions about the future"],ans:[0],
 why:"Rational analysis looks back at past situations to find and challenge the beliefs at work."},

l16:{type:'learn',title:"Feeling tools (emotive)",
 body:"<b>Rational emotive imagery (REI):</b> clients vividly imagine one of the <b>worst possible scenarios</b>, describe the disturbing feelings, then train healthier emotional responses.<br><b>Humor:</b> Ellis thought disturbance often comes from <b>taking yourself too seriously</b>. He even wrote humorous songs.<br><b>Role playing:</b> combines emotive, cognitive, and behavioral parts, like rehearsing a grad school interview to challenge “rejection means I'm stupid.”<br><b>Shame-attacking exercises:</b> doing things you avoid for fear of judgment (asking silly questions, wearing attention-grabbing clothes) to learn others are often indifferent. They must be <b>voluntary</b> and <b>never harmful or illegal</b>."},
l17:{type:'learn',title:"Doing tools (behavioral)",
 body:"REBT also uses <b>operant conditioning, self-management, desensitization, relaxation, and modeling</b>. <b>Homework in real-life situations</b> is essential, including <b>live exposure</b> and <b>in vivo desensitization</b>, so clients act differently and strengthen functional beliefs.",
 ex:"Afraid of public speaking? Homework: ask one question in class this week. That's in vivo exposure, the same way Ellis beat his own fear."},
q50:{type:'single',src:50,prompt:"In rational emotive imagery, clients first:",
 choices:["Vividly imagine one of the worst possible scenarios","Imagine their happiest memory","Read a self-help book","List their problems on paper"],ans:[0],
 why:"REI starts with the worst case and its disturbing feelings, then trains healthier emotional responses to it."},
q51:{type:'single',src:51,prompt:"Wearing attention-grabbing clothes in public on purpose, to learn people are often indifferent, is a:",
 choices:["Shame-attacking exercise","Relaxation technique","Bibliotherapy task","Devil's advocate exercise"],ans:[0],
 why:"Shame-attacking: do the thing you fear being judged for and discover others mostly don't care."},
q52:{type:'single',src:52,prompt:"Which rule must shame-attacking exercises follow?",
 choices:["They must be voluntary and never harmful or illegal","They must be done in front of the therapist only","They must embarrass the client as much as possible","They can be assigned without the client's consent"],ans:[0],
 why:"Voluntary, never harmful, never illegal."},
q53:{type:'single',src:53,prompt:"Why did Ellis use humor in therapy?",
 choices:["Emotional disturbance often comes from taking oneself too seriously","Humor replaces disputing","Clients pay more attention to jokes","Humor uncovers the unconscious"],ans:[0],
 why:"Humor shows how absurd rigid beliefs are and helps clients laugh at their self-defeating thinking."},
q54:{type:'single',src:54,prompt:"Which REBT technique combines emotive, cognitive, and behavioral elements, like rehearsing an interview?",
 choices:["Role playing","Bibliotherapy","Humor","Rational analysis"],ans:[0],
 why:"Role playing mixes all three: practice the behavior, notice the feeling, challenge the belief."},
q55:{type:'single',src:55,prompt:"Which is NOT a behavioral technique used in REBT?",
 choices:["Free association","Operant conditioning","Desensitization","Modeling"],ans:[0],
 why:"Free association is a psychoanalytic technique. REBT's behavioral list: operant conditioning, self-management, desensitization, relaxation, modeling."},
q56:{type:'multi',need:2,src:56,prompt:"Which TWO are emotive techniques? (Choose 2)",
 choices:["Rational emotive imagery","Shame-attacking exercises","Cognitive homework","Bibliotherapy"],ans:[0,1],
 why:"REI and shame-attacking are emotive. Cognitive homework and bibliotherapy are cognitive."},
m4:{type:'match',prompt:"Match each technique to what it looks like",pairs:[["Devil's advocate","Therapist argues for the belief"],["Reframing","Event seen as less catastrophic"],["REI","Imagine the worst, train new feelings"],["Shame-attacking","Do the “embarrassing” thing on purpose"],["In vivo desensitization","Real-life exposure homework"]],
 why:"Cognitive: devil's advocate, reframing. Emotive: REI, shame-attacking. Behavioral: in vivo desensitization."},

/* ---------------- UNIT 5: Reality Therapy foundations ---------------- */
l18:{type:'learn',title:"What is Reality Therapy?",say:"New theory! Different guy, different idea. Watch for the switch.",
 body:"<b>Reality therapy</b> views <b>behaviors as choices</b>. Symptoms don't happen because of mental health conditions but because people <b>choose behaviors to fulfill their needs</b> (Nunez, 2020). The goal: help people <b>accept responsibility</b> and <b>choose better actions</b> that connect them with others. It is a <b>client-centered form of CBT</b> focused on <b>present relationships and circumstances</b>. Key line: <b>we cannot control how we feel, but we can control how we think and behave.</b>"},
l19:{type:'learn',title:"Choice theory and the five needs",
 body:"Reality therapy is based on <b>Choice theory</b>: we are <b>not blank slates</b> waiting to be motivated by outside forces. We are born with <b>five genetically encoded needs</b>: <b>survival</b> (self-preservation), <b>love and belonging</b>, <b>power</b> (inner control), <b>freedom</b> (independence), and <b>fun</b> (enjoyment). Reality therapy helps people find unmet needs and make better, responsible choices to meet them (Corey, 2024).",
 ex:"Made-up mnemonic: <b>“Some Lovely People Find Fun”</b> = Survival, Love and belonging, Power, Freedom, Fun."},
q57:{type:'single',src:57,prompt:"How does reality therapy view behavior?",
 choices:["As a choice","As a product of the unconscious","As purely conditioned responses","As caused by mental illness"],ans:[0],
 why:"Behavior is a choice. People choose behaviors to meet their needs, not because of a mental health condition."},
q58:{type:'single',src:58,prompt:"Which theory is reality therapy based on?",
 choices:["Choice theory","Psychoanalytic theory","Social learning theory","Attachment theory"],ans:[0],
 why:"Choice theory: five innate needs drive behavior, and all behavior is chosen."},
q59:{type:'single',src:59,prompt:"Reality therapy says we cannot control ___, but we can control ___.",
 choices:["how we feel / how we think and behave","how we think / how we feel","our behavior / our needs","other people / our past"],ans:[0],
 why:"Feelings aren't directly controllable, but thinking and behaving are."},
q60:{type:'single',src:60,prompt:"Which is NOT one of the five basic needs in Choice theory?",
 choices:["Wealth","Survival","Freedom","Fun"],ans:[0],
 why:"The five: survival, love and belonging, power, freedom, fun. Wealth isn't one."},
q61:{type:'single',src:61,prompt:"In Choice theory, the need for “power” also means:",
 choices:["Inner control","Control over others","Money","Physical strength"],ans:[0],
 why:"Power = inner control. Freedom = independence, fun = enjoyment, survival = self-preservation."},
q62:{type:'multi',need:2,src:62,prompt:"Which TWO describe reality therapy? (Choose 2)",
 choices:["A client-centered form of cognitive behavioral therapy","Focused on present issues and current behaviors","Focused on uncovering early childhood memories","Based on the idea that people are blank slates"],ans:[0,1],
 why:"It's client-centered CBT focused on the present. Choice theory explicitly says we are NOT blank slates."},

l20:{type:'learn',title:"William Glasser (1925 to 2013)",
 body:"Born <b>May 11, 1925, in Cleveland, Ohio</b>. In <b>1962</b> he introduced <b>“Reality psychiatry,”</b> renamed <b>“Reality therapy”</b> in his <b>1965</b> book, which educators found especially useful. He <b>rejected the Freudian model</b>, partly because the psychoanalytically trained therapists he watched didn't really apply Freud and instead held people responsible for their behavior. He believed clients must <b>accept personal responsibility</b>. His <b>1968</b> book <b>Schools Without Failure</b> shaped school administration and teacher training. He died <b>August 23, 2013</b>, of respiratory failure from pneumonia."},
l21:{type:'learn',title:"Robert Wubbolding",
 body:"Born <b>February 1936</b>, raised in <b>Cincinnati, Ohio</b>, the <b>youngest of six</b>. Doctorate in counseling from the <b>University of Cincinnati</b>. Worked as a high school and elementary school <b>counselor</b> and a consultant for <b>U.S. Army and Air Force drug and alcohol abuse programs</b>. Trained under Glasser in Los Angeles, and in <b>1988</b> Glasser made him <b>director of training</b> for the William Glasser Institute. He extended reality therapy with the <b>WDEP system</b>.",
 ex:"Quick split: Glasser built it, Wubbolding systematized it (WDEP)."},
q63:{type:'single',src:63,prompt:"Who developed reality therapy?",
 choices:["William Glasser","Robert Wubbolding","Albert Ellis","Ray Corsini"],ans:[0],
 why:"Glasser developed it. Wubbolding extended it with WDEP. Ellis is REBT."},
q64:{type:'single',src:64,prompt:"What did Glasser first call his approach in 1962?",
 choices:["Reality psychiatry","Choice therapy","Rational therapy","Control theory"],ans:[0],
 why:"Reality psychiatry in 1962, renamed Reality therapy in his 1965 book. Rational therapy was Ellis's first name for REBT."},
q65:{type:'single',src:65,prompt:"Which 1968 book by Glasser influenced school administration and teacher training?",
 choices:["Schools Without Failure","Reality Therapy","Choice Theory","Learning Without Limits"],ans:[0],
 why:"Schools Without Failure (1968). Reality Therapy was the 1965 book."},
q66:{type:'single',src:66,prompt:"Why did Glasser reject the Freudian model?",
 choices:["Trained psychoanalysts he observed held people responsible instead of applying Freud","Freud's ideas were too focused on the present","He found Freud too behavioral","Freud refused to train him"],ans:[0],
 why:"He noticed psychoanalytically trained therapists tended to hold people responsible for their behavior, not follow Freudian principles."},
q67:{type:'single',src:67,prompt:"Robert Wubbolding is best known for extending reality therapy with:",
 choices:["The WDEP system","The ABCDE model","The quality world","Shame-attacking exercises"],ans:[0],
 why:"WDEP is Wubbolding's. ABCDE and shame-attacking are Ellis's, and the quality world comes from Glasser's Choice theory."},
q68:{type:'single',src:68,prompt:"In 1988, Glasser appointed Wubbolding as:",
 choices:["Director of training for the William Glasser Institute","President of a psychology association","Dean at the University of Cincinnati","Head of a U.S. Army counseling program"],ans:[0],
 why:"Director of training, overseeing certification and instructor training programs."},

l22:{type:'learn',title:"Needs and the quality world",
 body:"The <b>five innate needs drive all human behavior</b>, and <b>love and belonging is primary</b> because it's essential for meeting the others. Each person builds a <b>quality world</b>: a mental image of their <b>ideal world</b>, their <b>personal Shangri-la</b>, at the core of their life. It holds specific <b>people, activities, beliefs, and possessions</b> that meet their needs, like an <b>inner picture album</b> of wants and ways to satisfy them."},
l23:{type:'learn',title:"Choices and relationships",
 body:"<b>All behavior is a choice.</b> People choose behaviors they believe will meet their needs and bring them closer to their quality world. <b>When people feel bad, it's because their choices aren't working.</b> <b>Strong, positive relationships</b> are essential for meeting needs and being happy, so therapists teach effective communication and problem-solving skills.",
 ex:"Lonely while scrolling alone at 2 a.m.? Choice theory says the choice (scrolling) isn't meeting the need (belonging). Time for a better choice."},
q69:{type:'single',src:69,prompt:"Which need is considered primary in reality therapy?",
 choices:["Love and belonging","Survival","Power","Fun"],ans:[0],
 why:"Love and belonging is primary because it's essential for fulfilling the other needs."},
q70:{type:'single',src:70,prompt:"A person's mental picture of their ideal world is called the:",
 choices:["Quality world","Comfort zone","Ideal self","Life space"],ans:[0],
 why:"The quality world: your personal Shangri-la of people, activities, beliefs, and possessions."},
q71:{type:'single',src:71,prompt:"Which is NOT part of a quality world, according to the lesson?",
 choices:["Repressed memories","Specific people","Activities","Beliefs and possessions"],ans:[0],
 why:"The quality world holds people, activities, beliefs, and possessions. Repressed memories are a Freudian idea."},
q72:{type:'single',src:72,prompt:"According to reality therapy, why do people feel bad?",
 choices:["Their choices aren't working to meet their needs","Their parents raised them poorly","They have a chemical imbalance","They hold irrational musts"],ans:[0],
 why:"Reality therapy: bad feelings mean the choices aren't working. “Irrational musts” is the REBT answer, a different theory."},
q73:{type:'single',src:73,prompt:"The quality world is described as a person's personal:",
 choices:["Shangri-la","Fortress","Safe house","Hall of fame"],ans:[0],
 why:"Personal Shangri-la: the world we would like to live in if we could."},
q74:{type:'single',src:74,prompt:"Why do reality therapists teach communication and problem-solving skills?",
 choices:["Strong, positive relationships are essential for meeting needs","To help clients win arguments","To diagnose mental illness","To replace action planning"],ans:[0],
 why:"Healthy relationships are how most needs, especially love and belonging, get met."},
m5:{type:'match',prompt:"Match each need to its other name",pairs:[["Survival","Self-preservation"],["Love and belonging","The primary need"],["Power","Inner control"],["Freedom","Independence"],["Fun","Enjoyment"]],
 why:"Some Lovely People Find Fun: survival, love and belonging, power, freedom, fun."},

/* ---------------- UNIT 6: Reality Therapy process ---------------- */
l24:{type:'learn',title:"Goals and the therapist's role",say:"Last unit! Finish strong.",
 body:"<b>Main goal:</b> help clients <b>connect or reconnect with people they value</b>, meeting the need for <b>love and belonging</b>. It also helps meet needs like achievement, power or inner control, freedom, independence, and enjoyment, which serve as <b>blueprints for short- and long-term goals</b>.<br>The therapist builds <b>involvement and rapport</b> through <b>empathy and active listening</b>, asks thought-provoking questions that push <b>self-evaluation</b>, and guides clients to <b>assess their own</b> behavior, wants, perceptions, and plans <b>rather than evaluating them directly</b>. They <b>instill hope</b> that change is possible and act as advocates."},
q75:{type:'single',src:75,prompt:"What is the primary goal of reality therapy?",
 choices:["Help clients connect or reconnect with people they value","Help clients uncover unconscious conflicts","Help clients dispute irrational beliefs","Help clients get an accurate diagnosis"],ans:[0],
 why:"Connecting with valued people fulfills love and belonging, the primary need. Disputing irrational beliefs is REBT."},
q76:{type:'single',src:76,prompt:"In reality therapy, who evaluates the client's behavior?",
 choices:["The client, guided by the therapist's questions","The therapist, directly","The client's family","A psychiatric diagnosis"],ans:[0],
 why:"Therapists guide clients to assess themselves rather than evaluating them directly."},
q77:{type:'single',src:77,prompt:"The therapist builds involvement and rapport mainly through:",
 choices:["Empathy and active listening","Interpreting dreams","Prescribing medication","Strict confrontation"],ans:[0],
 why:"Empathy and active listening create the involvement that the rest of therapy needs."},
q78:{type:'single',src:78,prompt:"In reality therapy, the client's needs serve as:",
 choices:["Blueprints for short- and long-term goals","Symptoms to diagnose","Evidence of mental illness","Rewards for good behavior"],ans:[0],
 why:"Needs are blueprints for setting goals, both short- and long-term."},
q79:{type:'single',src:79,prompt:"Which attitude should a reality therapist keep?",
 choices:["Optimism and hope that change is possible","Neutral distance from the client","Low expectations to avoid disappointment","A focus on past failures"],ans:[0],
 why:"Therapists maintain optimism and instill hope, no matter the circumstances."},

l25:{type:'learn',title:"What makes it different, part 1",
 body:"<b>Emphasize choice and responsibility:</b> clients have more control than they think. This is <b>not blame or punishment</b>, but clients are accountable, and they act <b>“as if”</b> they have options. Meaningful activities like work help meet needs.<br><b>Reject transference:</b> therapists stay authentic. If a client says “I see you as my father,” Glasser answers <b>“I am not your mother or father. I am myself.”</b><br><b>Keep therapy in the present:</b> the past may influence current problems but is <b>never the problem itself</b> (Glasser, 2001). Past successes can be acknowledged, but little time goes to past failures."},
l26:{type:'learn',title:"What makes it different, part 2",
 body:"<b>Avoid focusing on symptoms:</b> symptoms are <b>signals</b> that current behaviors aren't meeting needs. Most symptoms come from <b>unhappy present relationships</b> (Glasser, 2005).<br><b>Challenge traditional views of mental illness:</b> Glasser warns against overreliance on diagnoses and <b>psychiatric drugs</b>. Wubbolding supports using the <b>DSM-5 creatively</b> and calls reality therapy a <b>mental health system, not a mental disorder system</b>. Erickson: <b>“people don't have problems, they have solutions that haven't worked.”</b>",
 ex:"Five traits hook: <b>Choice, No transference, Now, Not symptoms, Not illness.</b>"},
q80:{type:'single',src:80,prompt:"A client says, “I act this way because I see you as my mother.” A reality therapist would most likely say:",
 choices:["“I am not your mother or father. I am myself.”","“Let's explore that transference in depth.”","“Tell me about your childhood with her.”","“That must mean you have a disorder.”"],ans:[0],
 why:"Reality therapy rejects transference. The therapist stays authentic and present."},
q81:{type:'single',src:81,prompt:"How does reality therapy view the past?",
 choices:["It may influence current problems but is never the problem itself","It is the main focus of therapy","It is ignored completely, even past successes","It explains all current symptoms"],ans:[0],
 why:"Glasser (2001): the past can influence, but it's never the problem. Past successes may still be acknowledged."},
q82:{type:'single',src:82,prompt:"According to Glasser (2005), most symptoms come from:",
 choices:["Unhappy present relationships","Childhood trauma","Brain chemistry","Irrational beliefs"],ans:[0],
 why:"Unhappy present relationships. Irrational beliefs would be the REBT answer."},
q83:{type:'single',src:83,prompt:"Wubbolding views reality therapy as a:",
 choices:["Mental health system, not a mental disorder system","Mental disorder system","Medication-based system","Purely diagnostic system"],ans:[0],
 why:"Wubbolding (2017): a mental health system, not a mental disorder system."},
q84:{type:'single',src:84,prompt:"In reality therapy, symptoms are treated as:",
 choices:["Signals that current behaviors aren't meeting needs","The main target of treatment","Proof of mental illness","Unconscious defenses"],ans:[0],
 why:"Symptoms are signals. Therapy focuses on current problems, especially relationships, instead."},
q85:{type:'single',src:85,prompt:"Emphasizing responsibility in reality therapy means:",
 choices:["Clients are accountable for their choices, without blame or punishment","Clients are punished for bad choices","The therapist takes responsibility for the client","The past is blamed for the client's behavior"],ans:[0],
 why:"Accountable, yes. Blamed or punished, no."},
q86:{type:'single',src:86,prompt:"“People don't have problems, they have solutions that haven't worked” comes from:",
 choices:["Erickson","Glasser","Ellis","Wubbolding"],ans:[0],
 why:"It's Erickson's principle, which reality therapists draw on to reframe negative behaviors and labels."},

l27:{type:'learn',title:"Seven techniques",
 body:"<b>Self-evaluation:</b> does my behavior match my goals?<br><b>Action planning:</b> simple, measurable, realistic plans for immediate change.<br><b>Reframing:</b> restate problems in a more positive, solution-focused light.<br><b>Behavioral rehearsal:</b> practice social behaviors in session.<br><b>Commitment to change:</b> commit to the plan.<br><b>Avoiding excuses and blame:</b> focus on what you can control.<br><b>Ongoing review:</b> keep checking progress and adjusting the plan."},
l28:{type:'learn',title:"WDEP and SAMIC",
 body:"<b>WDEP:</b> <b>Wants</b> (what the client truly wants), <b>Doing</b> (current actions), <b>Evaluation</b> (are those actions working?), <b>Planning</b> (specific, attainable steps).<br>Self-evaluation questions: <b>“Is what you're doing helping or hurting?”</b> “Is your behavior working for you?”<br>Plans follow <b>SAMIC</b>: <b>Simple, Attainable, Measurable, Immediate, Committed</b>.<br>To build commitment, ask <b>“What are you willing to do today to start changing your life?”</b> and explore <b>fears of failure</b>.<br>Takeaways: change starts with <b>honest self-assessment</b>, <b>insight alone is not enough, action is necessary</b>, and clients shape their own destiny.",
 ex:"Want: better grades. Doing: gaming till 3 a.m. Evaluation: is that working? Plan: study 30 minutes tonight before gaming. Simple, attainable, measurable, immediate, committed."},
q87:{type:'single',src:87,prompt:"What does WDEP stand for?",
 choices:["Wants, Doing, Evaluation, Planning","Wishes, Doubts, Emotions, Progress","Wants, Decisions, Effects, Practice","Work, Duty, Effort, Purpose"],ans:[0],
 why:"Wants, Doing, Evaluation, Planning: Wubbolding's system."},
q88:{type:'single',src:88,prompt:"“Is what you're doing helping or hurting?” is a question that promotes:",
 choices:["Self-evaluation","Transference","Free association","Disputing"],ans:[0],
 why:"It's artful questioning to promote self-evaluation. Disputing is REBT's move."},
q89:{type:'single',src:89,prompt:"In WDEP, which step asks whether current actions are working?",
 choices:["Evaluation","Wants","Doing","Planning"],ans:[0],
 why:"Doing describes what you do. Evaluation judges whether it's working."},
q90:{type:'single',src:90,prompt:"What does the I in SAMIC stand for?",
 choices:["Immediate","Insightful","Independent","Intense"],ans:[0],
 why:"Immediate: start as soon as possible. Insight alone isn't enough in reality therapy."},
q91:{type:'multi',need:3,src:91,prompt:"Which are part of SAMIC planning? (Choose 3)",
 choices:["Simple","Measurable","Committed","Complicated"],ans:[0,1,2],
 why:"Simple, Attainable, Measurable, Immediate, Committed. Complicated is the opposite of Simple."},
q92:{type:'single',src:92,prompt:"A client practices asking a classmate for help during the session before trying it for real. This is:",
 choices:["Behavioral rehearsal","Ongoing review","Reframing","Commitment to change"],ans:[0],
 why:"Behavioral rehearsal: practice the social behavior in session to prepare for real life."},
q93:{type:'single',src:93,prompt:"Which is a key takeaway of reality therapy?",
 choices:["Insight alone is not enough, action is necessary","Insight alone is enough to change","The therapist shapes the client's destiny","The past must be fully understood first"],ans:[0],
 why:"Change starts with honest self-assessment, then action. Clients shape their own destiny."},
q94:{type:'single',src:94,prompt:"To strengthen commitment, reality therapists explore the client's:",
 choices:["Fears of failure","Dreams","Childhood memories","Diagnosis"],ans:[0],
 why:"Exploring fears of failure strengthens commitment to the plan."},
m6:{type:'match',prompt:"Match each piece of WDEP and SAMIC",pairs:[["Wants","What you truly want"],["Doing","What you're doing now"],["Evaluation","Is it working?"],["Planning","Specific, attainable steps"],["SAMIC","How a good plan is built"]],
 why:"WDEP finds the gap between wants and doing, and SAMIC makes the plan doable."},
};

const today=()=>new Date().toISOString().slice(0,10);
function bumpStreak(){
  const t=today(); if(S.lastDay===t) return;
  const y=new Date(Date.now()-864e5).toISOString().slice(0,10);
  S.streak = (S.lastDay===y)? S.streak+1 : 1; S.lastDay=t;
}

   SOUND
   ============================================================ */
let AC=null;
function tone(seq){
  if(!S.sound) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    let t=AC.currentTime;
    seq.forEach(([f,d,type='sine',v=.15])=>{
      const o=AC.createOscillator(),g=AC.createGain();
      o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
      o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);t+=d*.7;
    });
  }catch(e){}
}
