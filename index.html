function putMascots(root=document){root.querySelectorAll('[data-mascot]').forEach(el=>{el.innerHTML=mascotMarkup();const m=el.querySelector('.mascot');m.classList.add(el.dataset.mascot||'idle');el.removeAttribute('data-mascot')})}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const $=s=>document.querySelector(s);

/* ============================================================
   HOME
   ============================================================ */
const OFFS=[0,-70,-100,-70,0,70,100,70];
function renderStatic(){
  document.title=CONFIG.pageTitle; $('#cTag').textContent=CONFIG.courseTag; $('#cMod').textContent=CONFIG.moduleLabel;
  $('#hTitle').textContent=CONFIG.title; $('#hBlurb').textContent=CONFIG.blurb; $('#bossTitle').textContent=CONFIG.bossTitle;
  const hs=$('#hScore'); if(CONFIG.realScore!=null) hs.textContent=`Real quiz: ${CONFIG.realScore}/${RT}`; else hs.remove();
}
function renderHome(){
  $('#sStreak').textContent=S.streak; $('#sXP').textContent=S.xp;
  $('#soundBtn').innerHTML=S.sound?ICON.soundOn:ICON.soundOff;
  const doneCount=ALL_LESSONS.filter(l=>S.done[l.id]!=null).length;
  $('#lessonsDone').textContent=`${doneCount}/${ALL_LESSONS.length} lessons`;
  const nextId=(ALL_LESSONS.find(l=>S.done[l.id]==null)||{}).id;
  let k=0;
  $('#units').innerHTML=UNITS.map(u=>`
    <section class="unit">
      <div class="unit-banner" style="background:${u.color}">
        <div><div class="u-label">Unit ${u.n}</div><div class="u-title">${u.title}</div><div style="font-size:14px;opacity:.9;margin-top:2px">${u.sub}</div></div>
        <button class="guide-btn" style="background:${u.shade}" data-guide="${u.n}">${ICON.book}<span>Guide</span></button>
      </div>
      <div class="path">${u.lessons.map(l=>{const off=OFFS[k++%OFFS.length];const done=S.done[l.id]!=null;const cur=l.id===nextId;
        return `<div class="node-wrap" style="transform:translateX(${off}px)">
          ${cur?`<div class="start-bubble" style="color:${u.color}">Start</div>`:''}
          <button class="node ${done?'done':''}" data-lesson="${l.id}" style="background:${u.color};box-shadow:0 7px 0 ${u.shade}">
            ${cur?'<span class="ring"></span>':''}${done?ICON.check:(u.hard?ICON.bolt:ICON.star)}</button>
          <div class="node-label">${l.title}${done?`<br><span style="color:var(--gold-d)">Best ${S.done[l.id]}%</span>`:''}</div>
        </div>`}).join('')}</div>
    </section>`).join('');
  const realTxt = CONFIG.realScore!=null ? ` Beat your ${CONFIG.realScore}/${RT}.` : '';
  $('#bossSub').textContent = (S.bestBoss!=null ? `Best: ${S.bestBoss}/${REAL_IDS.length}. ` : '') + `All ${REAL_IDS.length} ${CONFIG.bossNoun||'questions'}, shuffled. No re-tries.` + realTxt;
  const fab=$('#fab');
  if(S.mistakes.length){fab.classList.remove('hidden');$('#fabBtn').textContent=`Practice mistakes (${S.mistakes.length})`}else fab.classList.add('hidden');
  putMascots();
}
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-guide]'); if(g){openGuide(+g.dataset.guide);return}
  const n=e.target.closest('[data-lesson]');
  document.querySelectorAll('.popover').forEach(p=>p.remove());
  document.querySelectorAll('.node-wrap.open').forEach(w=>w.classList.remove('open'));
  if(n){
    sfx.tap();
    const l=ALL_LESSONS.find(x=>x.id===n.dataset.lesson);
    const pop=document.createElement('div');pop.className='popover';pop.style.background=l.unit.color;pop.style.color=l.unit.color;
    const xp=l.items.length*10;
    pop.innerHTML=`<h3 style="color:#fff">${l.title}</h3><p style="color:#fff">${l.items.length} exercises · up to +${xp+20} XP</p><button class="btn">${S.done[l.id]!=null?'Practice again':'Start'}</button>`;
    pop.querySelector('.btn').onclick=ev=>{ev.stopPropagation();startLesson({mode:'lesson',lesson:l,items:l.items})};
    n.parentElement.appendChild(pop);n.parentElement.classList.add('open');
    const r=pop.getBoundingClientRect(); if(r.bottom>innerHeight-90) scrollBy({top:r.bottom-innerHeight+110,behavior:'smooth'});
  }
});
$('#soundBtn').onclick=()=>{S.sound=!S.sound;save();renderHome();sfx.tap()};
$('#bossBtn').onclick=()=>startLesson({mode:'exam',title:'Final Boss',items:shuffle(REAL_IDS)});
$('#fabBtn').onclick=()=>startLesson({mode:'mistakes',title:'Mistakes',items:shuffle(S.mistakes)});

function openGuide(n){
  const u=UNITS.find(x=>x.n===n);
  const ov=$('#overlay');
  ov.innerHTML=`<div class="modal-bg"><div class="modal">
    <div class="pill" style="background:${u.color};color:#fff">Unit ${u.n} guidebook</div>
    <h2 style="margin-top:10px">${u.title}</h2><div class="msub">${u.sub}</div>
    ${u.guide.map(([t,d])=>`<div class="gb-item"><div class="gb-term" style="color:${u.shade}">${t}</div><div class="gb-def">${d}</div></div>`).join('')}
    <div class="tip">${u.tip}</div>
    <button class="btn wide" id="gClose">Got it</button></div></div>`;
  const close=()=>ov.innerHTML='';
  ov.querySelector('#gClose').onclick=close;
  ov.querySelector('.modal-bg').onclick=e=>{if(e.target.classList.contains('modal-bg'))close()};
}

/* ============================================================
   LESSON ENGINE
   ============================================================ */
let L=null;
function startLesson(cfg){
  document.querySelectorAll('.popover').forEach(p=>p.remove());
  L={...cfg,queue:cfg.items.slice(),unique:cfg.items.length,graded:cfg.items.filter(i=>ITEMS[i].type!=='learn').length,cleared:0,first:{},hearts:cfg.mode==='exam'?Infinity:5,
     combo:0,maxCombo:0,xp:0,t0:Date.now(),state:'idle',cur:null,examRight:0,examWrong:[]};
  $('#lesson').classList.remove('hidden');document.body.style.overflow='hidden';
  next();
}
function updateHead(){
  $('#barFill').style.width=Math.max(4,(L.cleared/L.unique)*100)+'%';
  const h=$('#lHearts');
  if(L.hearts===Infinity){h.className='l-hearts inf';h.innerHTML=ICON.inf}
  else{h.className='l-hearts';h.innerHTML=(L.hearts>0?ICON.heart:ICON.heartGray)+`<span>${L.hearts}</span>`}
}
function next(){
  if(!L.queue.length){return finish()}
  const id=L.queue.shift(); const it=ITEMS[id];
  L.cur={id,it,sel:new Set(),order:null};
  L.state='idle'; updateHead();
  const foot=$('#foot');foot.className='l-foot';$('#fb').innerHTML='';
  const btn=$('#mainBtn');btn.textContent='Check';btn.disabled=true;btn.className='btn';btn.classList.toggle('hidden',it.type==='match');
  const retry = L.first[id]===false;
  const comboHTML = L.combo>=2?`<div class="combo pop">${ICON.fire}${L.combo} in a row</div>`:`<div class="combo"></div>`;
  const tags = `<div class="q-tag">
      ${retry?'<span class="pill red">Fix this mistake</span>':''}
      ${it.missed?'<span class="pill red">Missed on real quiz</span>':''}
      ${(it.src&&CONFIG.srcPill)?`<span class="pill blue">${CONFIG.srcPill}${it.src}</span>`:(id.startsWith('h')?'<span class="pill gold">Bonus · Hard</span>':'')}
    </div>`;
  const qa=$('#qArea');
  if(it.type==='learn'){
    L.state='learn'; btn.textContent='Got it'; btn.disabled=false; btn.classList.remove('hidden');
    qa.innerHTML=`<div class="combo"></div><div class="q-tag"><span class="pill green">New concept</span></div>
      <div class="speaker"><div class="mascot-wrap" data-mascot="idle"></div><div class="bubble">${it.say||"Here's something new. Read it, then I'll quiz you!"}</div></div>
      <div class="learn"><h2>${it.title}</h2><div class="body">${it.body}</div>${it.ex?`<div class="ex">${it.ex}</div>`:''}</div>`;
    putMascots(qa); $('.l-body').scrollTop=0; return;
  }
  if(it.type==='match'){
    const left=shuffle(it.pairs.map((p,i)=>({i,t:p[0]}))), right=shuffle(it.pairs.map((p,i)=>({i,t:p[1]})));
    L.cur.match={pick:null,left:0,mistakes:0,found:0};
    qa.innerHTML=`${comboHTML}${tags}<div class="q-title">${it.prompt}</div>
      <div class="match"><div class="col">${left.map(x=>`<button class="tile term" data-side="L" data-i="${x.i}">${x.t}</button>`).join('')}</div>
      <div class="col">${right.map(x=>`<button class="tile" data-side="R" data-i="${x.i}">${x.t}</button>`).join('')}</div></div>`;
    qa.querySelectorAll('.tile').forEach(t=>t.onclick=()=>matchTap(t));
  }else{
    const order=shuffle(it.choices.map((_,i)=>i)); L.cur.order=order;
    const label = it.type==='multi'?`Select ${it.need} answers`:'Select the correct answer';
    qa.innerHTML=`${comboHTML}${tags}<div class="q-type">${label}</div>
      <div class="speaker"><div class="mascot-wrap" data-mascot="idle"></div><div class="bubble">${it.prompt}</div></div>
      <div class="choices">${order.map((oi,k)=>`<button class="choice ${it.type==='multi'?'multi':''}" data-k="${k}"><span class="key">${k+1}</span><span>${it.choices[oi]}</span></button>`).join('')}</div>`;
    qa.querySelectorAll('.choice').forEach(c=>c.onclick=()=>pick(+c.dataset.k));
    putMascots(qa);
  }
  $('.l-body').scrollTop=0;
}
function pick(k){
  if(L.state!=='idle')return; sfx.tap();
  const it=L.cur.it, sel=L.cur.sel;
  if(it.type==='multi'){sel.has(k)?sel.delete(k):sel.add(k)}else{sel.clear();sel.add(k)}
  document.querySelectorAll('.choice').forEach(c=>c.classList.toggle('sel',sel.has(+c.dataset.k)));
  $('#mainBtn').disabled = it.type==='multi'? sel.size!==it.need : sel.size===0;
}
function check(){
  const {it,sel,order,id}=L.cur;
  const picked=[...sel].map(k=>order[k]).sort();
  const right=it.ans.slice().sort();
  const ok=picked.length===right.length&&picked.every((v,i)=>v===right[i]);
  document.querySelectorAll('.choice').forEach(c=>{
    const oi=order[+c.dataset.k];c.disabled=true;c.classList.remove('sel');
    if(it.ans.includes(oi)) c.classList.add('right');
    else if(sel.has(+c.dataset.k)){c.classList.add('wrong','shake')}
  });
  const ansHTML=it.ans.map(i=>it.choices[i]).join('<br>');
  resolve(ok,ansHTML);
}
function resolve(ok,ansHTML){
  const {id,it}=L.cur;
  const firstTry = L.first[id]===undefined;
  if(firstTry) L.first[id]=ok;
  L.state='feedback';
  const m=document.querySelector('#qArea .mascot'); if(m){m.classList.remove('idle');m.classList.add(ok?'happy':'sad')}
  if(ok){
    sfx.ok(); L.combo++; L.maxCombo=Math.max(L.maxCombo,L.combo); L.cleared++;
    L.xp += firstTry?10:5;
    if(L.mode==='exam') L.examRight++;
    if(it.type!=='match' && S.mistakes.includes(id) && (L.mode==='mistakes' || firstTry)) S.mistakes=S.mistakes.filter(x=>x!==id);
  }else{
    sfx.no(); L.combo=0;
    if(it.type!=='match' && !S.mistakes.includes(id)) S.mistakes.push(id);
    if(L.mode==='exam'){L.cleared++;L.examWrong.push(id)}
    else { L.queue.push(id); if(L.hearts!==Infinity) L.hearts--; }
  }
  save(); updateHead();
  const titles = ok? ['Nicely done!','Correct!','Great job!','You got it!','Amazing!'] : ['Not quite','Incorrect','So close'];
  const title = titles[Math.random()*titles.length|0];
  $('#foot').className='l-foot '+(ok?'ok':'no');
  $('#fb').innerHTML=`<div class="fb-icon">${ok?ICON.okBig:ICON.noBig}</div><div>
     <h3>${title}</h3>${(!ok&&ansHTML)?`<div class="ans">Correct answer:<br>${ansHTML}</div>`:''}<div class="why">${it.why}</div></div>`;
  const btn=$('#mainBtn'); btn.classList.remove('hidden'); btn.disabled=false; btn.textContent= ok?'Continue':'Got it';
  btn.focus({preventScroll:true});
}
function matchTap(t){
  if(L.state!=='idle'||t.classList.contains('gone'))return;
  sfx.tap();
  const M=L.cur.match, side=t.dataset.side;
  if(!M.pick || M.pick.dataset.side===side){
    document.querySelectorAll('.tile.sel').forEach(x=>x.classList.remove('sel'));
    t.classList.add('sel'); M.pick=t; return;
  }
  const a=M.pick,b=t; M.pick=null; a.classList.remove('sel');
  if(a.dataset.i===b.dataset.i){
    [a,b].forEach(x=>{x.classList.add('ok');x.disabled=true});
    tone([[660+M.found*90,.1,'sine',.08]]);
    setTimeout(()=>[a,b].forEach(x=>{x.classList.remove('ok');x.classList.add('gone')}),450);
    M.found++;
    if(M.found===L.cur.it.pairs.length) setTimeout(()=>{
      const clean=M.mistakes===0;
      L.first[L.cur.id]=clean; // accuracy credit only if flawless
      resolveMatch(clean);
    },500);
  }else{
    M.mistakes++; [a,b].forEach(x=>x.classList.add('bad')); sfx.no();
    setTimeout(()=>[a,b].forEach(x=>x.classList.remove('bad')),450);
  }
}
function resolveMatch(clean){
  // match never costs hearts or re-queues; counts as cleared
  const {id,it}=L.cur;
  L.state='feedback'; L.cleared++; L.xp+=clean?10:5;
  if(clean){L.combo++;L.maxCombo=Math.max(L.maxCombo,L.combo)}else L.combo=0;
  sfx.ok(); updateHead();
  $('#foot').className='l-foot ok';
  $('#fb').innerHTML=`<div class="fb-icon">${ICON.okBig}</div><div><h3>${clean?'Flawless match!':'All matched!'}</h3>
    ${clean?'':`<div class="ans">${L.cur.match.mistakes} wrong tap${L.cur.match.mistakes>1?'s':''} along the way</div>`}<div class="why">${it.why}</div></div>`;
  const btn=$('#mainBtn'); btn.classList.remove('hidden'); btn.disabled=false; btn.textContent='Continue';
}
$('#mainBtn').onclick=()=>{
  if(L.state==='learn'){ sfx.tap(); L.cleared++; updateHead(); next(); return; }
  if(L.state==='idle'){ if(!$('#mainBtn').disabled) check(); }
  else if(L.state==='feedback'){
    if(L.hearts!==Infinity && L.hearts<=0) return outOfHearts();
    next();
  }
};
document.addEventListener('keydown',e=>{
  if(!L||$('#lesson').classList.contains('hidden')||$('#overlay').innerHTML)return;
  if(e.key==='Enter'){e.preventDefault();$('#mainBtn').click();return}
  const n=parseInt(e.key,10);
  if(n>=1&&n<=9&&L.state==='idle'&&L.cur.it.choices&&n<=L.cur.it.choices.length) pick(n-1);
});
$('#quitBtn').onclick=()=>{
  const ov=$('#overlay');
  ov.innerHTML=`<div class="modal-bg"><div class="modal" style="text-align:center">
    <div style="width:110px;margin:0 auto 8px" data-mascot="sad"></div>
    <h2>Wait, don't go!</h2><div class="msub">You'll lose your progress in this lesson.</div>
    <button class="btn blue wide" id="stay">Keep learning</button>
    <button class="btn ghost gray wide" id="leave" style="margin-top:12px">End session</button></div></div>`;
  putMascots(ov);
  ov.querySelector('#stay').onclick=()=>ov.innerHTML='';
  ov.querySelector('#leave').onclick=()=>{ov.innerHTML='';exitLesson()};
};
function outOfHearts(){
  const ov=$('#overlay');
  ov.innerHTML=`<div class="modal-bg"><div class="modal" style="text-align:center">
    <div style="width:110px;margin:0 auto 8px" data-mascot="sad"></div>
    <h2>You ran out of hearts!</h2><div class="msub">Read the guidebook, or refill and keep grinding. Refills cut this lesson's XP in half.</div>
    <button class="btn red wide" id="refill">${ICON.heart.replace('#FF4B4B','#fff')} Refill hearts</button>
    <button class="btn ghost gray wide" id="giveup" style="margin-top:12px">Quit lesson</button></div></div>`;
  putMascots(ov);
  ov.querySelector('#refill').onclick=()=>{ov.innerHTML='';L.hearts=5;L.refilled=true;updateHead();next()};
  ov.querySelector('#giveup').onclick=()=>{ov.innerHTML='';exitLesson()};
}
function exitLesson(){$('#lesson').classList.add('hidden');document.body.style.overflow='';L=null;renderHome()}

function finish(){
  const secs=Math.round((Date.now()-L.t0)/1000), mm=Math.floor(secs/60), ss=String(secs%60).padStart(2,'0');
  const firstOk=Object.values(L.first).filter(v=>v===true).length;
  const acc=L.graded?Math.round(firstOk/L.graded*100):100;
  let xp=L.xp; const perfect=acc===100;
  if(perfect && L.mode!=='exam') xp+=20;
  if(L.refilled) xp=Math.round(xp/2);
  S.xp+=xp; bumpStreak();
  if(L.mode==='lesson') S.done[L.lesson.id]=Math.max(S.done[L.lesson.id]||0,acc);
  if(L.mode==='exam') S.bestBoss=Math.max(S.bestBoss||0,L.examRight);
  save(); sfx.win();
  const isExam=L.mode==='exam';
  const N=REAL_IDS.length, R=CONFIG.realScore;
  const head = isExam ? (L.examRight===N?`Perfect ${N}/${N}!`:(R!=null&&L.examRight>R)?`New record! You beat ${R}/${RT}!`:(R!=null&&L.examRight===R)?'Matched your real score!':'Boss defeated... kinda')
              : perfect?'Perfect lesson!':'Lesson complete!';
  const sub = isExam ? `You scored <b>${L.examRight}/${N}</b>.`+(R!=null?` Real quiz: ${R}/${RT}.`:'') : (perfect?'Zero mistakes. Bonus +20 XP.':`Max combo: ${L.maxCombo} in a row.`);
  const ov=$('#overlay');
  ov.innerHTML=`<div class="screen" id="win">
    <div class="mascot-wrap" data-mascot="happy"></div>
    <h2>${head}</h2><div class="sub">${sub}</div>
    <div class="cards">
      <div class="scard gold"><div class="t">Total XP</div><div class="v">${ICON.bolt2}${xp}</div></div>
      <div class="scard green"><div class="t">${isExam?'Score':'Accuracy'}</div><div class="v">${ICON.target}${isExam?L.examRight+'/'+N:acc+'%'}</div></div>
      <div class="scard blue"><div class="t">Time</div><div class="v">${ICON.clock}${mm}:${ss}</div></div>
      <div class="scard orange"><div class="t">Streak</div><div class="v">${ICON.fire}${S.streak}</div></div>
    </div>
    ${isExam&&L.examWrong.length?`<div class="review-list">${L.examWrong.map(id=>{const it=ITEMS[id];return `<div class="ri">Q${it.src}: ${it.prompt}<br><span>✓ ${it.ans.map(i=>it.choices[i]).join(', ')}</span></div>`}).join('')}</div>`:''}
    <div class="actions"><button class="btn wide" id="cont">Continue</button>
    ${S.mistakes.length?`<button class="btn ghost wide" id="pm">Practice mistakes (${S.mistakes.length})</button>`:''}</div>
  </div>`;
  putMascots(ov);
  const win=ov.querySelector('#win');
  const cols=['#58CC02','#1CB0F6','#FFC800','#FF4B4B','#CE82FF','#FF9600'];
  for(let i=0;i<70;i++){const c=document.createElement('div');c.className='confetti';c.style.left=Math.random()*100+'%';c.style.background=cols[i%cols.length];
    c.style.animationDuration=(2+Math.random()*2.5)+'s';c.style.animationDelay=(Math.random()*.6)+'s';win.appendChild(c)}
  ov.querySelector('#cont').onclick=()=>{ov.innerHTML='';exitLesson()};
  const pm=ov.querySelector('#pm'); if(pm) pm.onclick=()=>{ov.innerHTML='';exitLesson();startLesson({mode:'mistakes',items:shuffle(S.mistakes)})};
}

renderStatic();
renderHome();
</script>
</body>
</html>
